[project]
name = "farenus-bot"
version = "0.1.0"
description = "discord bot for farenus-network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michał Marcinkowski", email = "marcinkowski1901@icloud.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
